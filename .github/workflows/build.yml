name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档不用重编整个 JUCE
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '*.png'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '*.png'
  workflow_dispatch:

# 同一个分支连推几次时，取消还在跑的那次，别让它们排队烧分钟数
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # JUCE 由 CMakeLists.txt 里的 FetchContent 拉取（9.0.5）
      # 缓存一下，省掉每次 clone 的时间
      - name: Cache JUCE (source tarball)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.5-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      # 只编 CI 需要的目标：每个 target 都会把 JUCE 模块再编一遍，
      # 少一个 target 就省几分钟。TrackReport / UiSnapshot 只在本地用。
      - name: Build
        run: cmake --build build --config Release --parallel --target Bessel_VST3 PmEffectTest PluginScanTest

      # DSP 测试 + 宿主视角测试。任何一个失败都会让整个 job 变红。
      - name: Run DSP tests
        run: build\PmEffectTest_artefacts\Release\PmEffectTest.exe

      - name: Run host scan test
        run: build\PluginScanTest_artefacts\Release\PluginScanTest.exe


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bessel-Windows-x64
          path: build/Bessel_artefacts/Release/VST3/**
          if-no-files-found: error
